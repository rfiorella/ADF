name: adf_v1.0.3
channels:
  - conda-forge
  - defaults
dependencies:
  - pyyaml=6.0.2
  - scipy=1.12.0
  - cartopy=0.23.0
  # PROJ 9.8 returns inf when transforming a point at either pole between
  # two CRSs, which breaks cartopy's tick formatting for the +/-90 latitude
  # ticks used by the lat/lon maps (ValueError: cannot convert float NaN to
  # integer) and its LambertConformal boundary.  PROJ <= 9.7 is unaffected.
  - proj<9.8
  - netcdf4=1.6.5
  - xarray=2024.1.1
  - uxarray=2025.03.0
  - matplotlib=3.9.4
  - pandas=2.2.0
  - pint=0.23
  - geocat-comp=2024.04.0
  - python=3.12
  - xesmf>=0.8.8
  # Wasserstein-distance option of cloud_regime_analysis. Not needed for its
  # default (euclidean) mode, nor by any other diagnostic.
  - pot
  - joblib
